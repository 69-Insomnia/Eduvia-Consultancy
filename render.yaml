services:
  - type: web
    name: eduvia-api
    runtime: node
    region: singapore
    buildCommand: npm --prefix backend install
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Session pooler URI (port 6543, username postgres.<project-ref>).
      # The direct db.<ref>.supabase.co host is IPv6-only and unreachable
      # from Render/IPv4-only networks.
      - key: SUPABASE_DB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://eduviaconsultancy.com,https://www.eduviaconsultancy.com
      - key: SITE_URL
        value: https://eduviaconsultancy.com
