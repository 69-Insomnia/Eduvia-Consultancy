<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Eduvia Consultancy Pvt. Ltd. - Expert guidance for university selection, applications, scholarships and student visas for Nepali students." />
    <meta name="keywords" content="study abroad, education consultancy Nepal, student visa, university selection, scholarship guidance" />
    <meta name="theme-color" content="#203890" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
    <title>Eduvia Consultancy Pvt. Ltd. | Study Abroad from Nepal</title>
    <meta name="author" content="Eduvia Consultancy Pvt. Ltd." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://eduviaconsultancy.com/" />

    <!--
      Static social + structured-data fallbacks.

      This is a client-rendered SPA, so social scrapers (Facebook, WhatsApp,
      LinkedIn, X, Slack) and most LLM crawlers — none of which execute JS — only
      ever see this file. React replaces these at runtime for crawlers that do
      run JS; until then these are what a shared link previews as.

      The @ids below match those in src/components/common/StructuredData.jsx so
      the two graphs merge into one entity rather than reading as two
      organizations.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eduvia Consultancy" />
    <meta property="og:title" content="Eduvia Consultancy Pvt. Ltd. | Study Abroad from Nepal" />
    <meta property="og:description" content="Expert guidance for university selection, applications, scholarships and student visas for Nepali students." />
    <meta property="og:url" content="https://eduviaconsultancy.com/" />
    <meta property="og:image" content="https://eduviaconsultancy.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eduvia Consultancy Pvt. Ltd. | Study Abroad from Nepal" />
    <meta name="twitter:description" content="Expert guidance for university selection, applications, scholarships and student visas for Nepali students." />
    <meta name="twitter:image" content="https://eduviaconsultancy.com/og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "EducationalOrganization",
            "@id": "https://eduviaconsultancy.com/#organization",
            "name": "Eduvia Consultancy Pvt. Ltd.",
            "url": "https://eduviaconsultancy.com/",
            "logo": "https://eduviaconsultancy.com/logo.png",
            "description": "Education consultancy in Nepal guiding students through university selection, applications, scholarships and student visas."
          },
          {
            "@type": "WebSite",
            "@id": "https://eduviaconsultancy.com/#website",
            "name": "Eduvia Consultancy",
            "url": "https://eduviaconsultancy.com/",
            "publisher": { "@id": "https://eduviaconsultancy.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
